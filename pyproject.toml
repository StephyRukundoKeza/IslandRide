[project]
name = "islandride"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "StephyRukundoKeza", email = "kezastephy098@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "azure-storage-blob>=12.31.1",
    "duckdb>=2.0.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
islandride = "islandride:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
